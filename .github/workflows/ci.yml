name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Tests run the DB layer on node:sqlite (src/test/sql/node-sqlite.ts),
      # which needs a current Node; better-sqlite3 loads only under Electron.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # --ignore-scripts skips the electron-rebuild postinstall: nothing the
      # tests or the bun:sqlite check load imports better-sqlite3 at runtime
      # (only main.ts reaches its driver), so no native ABI build is needed.
      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: SqlConn contract (bun:sqlite)
        run: bun scripts/check-bun-sql.ts
